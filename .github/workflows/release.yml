# release-please keeps one release pull request open, carrying the next version and
# its changelog entry. Merging it tags vX.Y.Z and creates the GitHub release; the
# publish job then checks that every version declaration carries X.Y.Z, tests and
# builds the Python and the npm package, and publishes both through trusted
# publishing (OIDC): no token is stored. A timeskeleton version is a schema version,
# so it is never computed from the commits: the commit that adds a schema version
# carries a `Release-As: X.Y.Z` footer (see CONTRIBUTING.md).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release pull request and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # Refuses to tag a merged release pull request whose version is not the
      # version every declaration in the repository carries. A merged release pull
      # request is the push that changes the version in an existing manifest.
      - name: A merged release pull request names the declared version
        run: |
          manifest_version() { python3 -c 'import json, sys; print(json.load(sys.stdin)["."])'; }
          before=$(git show HEAD^:.release-please-manifest.json 2>/dev/null | manifest_version || true)
          after=$(manifest_version < .release-please-manifest.json)
          if [ -n "$before" ] && [ "$before" != "$after" ]; then
            python3 scripts/check_versions.py --tag "v$after"
          fi
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to PyPI and npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Version declarations carry the tag
        run: python3 scripts/check_versions.py --tag "${{ needs.release-please.outputs.tag_name }}"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
        working-directory: python
      - run: uv run ruff check . && uv run ruff format --check . && uv run pytest -q
        working-directory: python
      - name: Build the Python package
        run: uv build
        working-directory: python
      - name: Check the Python distributions
        run: uvx twine check --strict python/dist/*

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: js/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
        working-directory: js
      - run: pnpm lint && pnpm typecheck && pnpm test
        working-directory: js
      - run: pnpm build
        working-directory: js

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          # A re-run after a failed npm step finds the Python files published.
          skip-existing: true

      - name: Trusted publishing needs npm 11.5.1 or later
        run: npm install -g npm@latest
      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: js
